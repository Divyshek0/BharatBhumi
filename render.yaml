services:
  - type: web
    name: bharatbhumi-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend.Dockerfile
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: bharatbhumi-core
          property: hostport

  - type: web
    name: bharatbhumi-core
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./core.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bharatbhumi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_HOSTPORT
        fromService:
          type: web
          name: bharatbhumi-ai
          property: hostport
      - key: AI_INTERNAL_KEY
        fromService:
          type: web
          name: bharatbhumi-ai
          envVarKey: AI_INTERNAL_KEY
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: bharatbhumi-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai.Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bharatbhumi-db
          property: connectionString
      - key: AI_INTERNAL_KEY
        generateValue: true

databases:
  - name: bharatbhumi-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: bharatbhumi
    user: bharatbhumi
